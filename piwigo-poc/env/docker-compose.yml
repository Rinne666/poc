services:
  db:
    image: mariadb:10.11
    container_name: piwigo-poc-db
    environment:
      MARIADB_ROOT_PASSWORD: piwigo-poc-root
      MARIADB_DATABASE: piwigo
      MARIADB_USER: piwigo
      MARIADB_PASSWORD: piwigo-poc
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'mysqladmin ping -h 127.0.0.1 -u"piwigo" -p"piwigo-poc"'
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - db_data:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: piwigo-poc-web:8.2
    container_name: piwigo-poc-web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8089:80"
    environment:
      PIWIGO_DB_HOST: db
      PIWIGO_DB_USER: piwigo
      PIWIGO_DB_PASSWORD: piwigo-poc
      PIWIGO_DB_NAME: piwigo
    volumes:
      - ./piwigo-snapshot:/var/www/html
      - poc_upload:/var/www/html/upload
      - poc_data:/var/www/html/_data

volumes:
  db_data:
  poc_upload:
  poc_data:
